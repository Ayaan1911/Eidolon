<!DOCTYPE html>
<html>

<head>
  <title>EIDOLON Admin Portal - Authentication</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      /* Purple */
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }

    .error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <div style="text-align: center; margin-bottom: 20px;">
      <h1 style="font-size: 24px; color: #7c3aed; margin: 0;">
        EIDOLON
      </h1>
      <p style="font-size: 12px; color: #999; margin-top: 5px;">
        Secure Access Portal
      </p>
    </div>
    <h2>🔐 Admin Authentication</h2>
    <form>
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <div class="error">⚠️ Invalid credentials. Access denied.</div>
  </div>
</body>

</html>
