name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # ponytail: Render's Python version is set in its dashboard, not in this repo, so this
      # pins the version the tests were developed on. Change it to match Render if they differ.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No secrets needed: conftest.py supplies dummy ADMIN_KEY / HONEYTOKEN_SECRET and
      # stubs the network (geolocation, ntfy, GitHub, XposedOrNot).
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy value: only checks that a production build succeeds; nothing is deployed.
          VITE_API_BASE: https://api.example.invalid
