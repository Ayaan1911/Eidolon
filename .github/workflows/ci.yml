name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      # Render pins 3.11.9; test 3.14 as an additional compatibility check.
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      EIDOLON_ENV: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # requirements-dev.txt only *includes* requirements.txt, so hash both files.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Dev mode skips the startup secret check (main.py refuses weak secrets otherwise); no secrets are used.
      # Lint rules live in backend/ruff.toml.
      - run: ruff check .
      # No secrets needed: conftest.py sets dummy ADMIN_KEY / HONEYTOKEN_SECRET, stubs
      # geolocation and ntfy, and blocks real network calls; other external APIs are
      # mocked inside the tests that use them.
      # The coverage floor is 3 points under the measured 92% (app code only, not tests).
      - run: >
          python -m pytest
          --cov=services --cov=routers --cov=database --cov=db_config --cov=main --cov=models
          --cov-report=term-missing --cov-fail-under=89

  postgres:
    # The same migrations and a smoke test against a real Postgres (production's database),
    # because SQLite hides differences (timestamps with time zone, real concurrency, constraints).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for a container that exists only for this job; not a repository secret.
          POSTGRES_USER: eidolon
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: eidolon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eidolon -d eidolon_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EIDOLON_ENV: dev
      # localhost, so no SSL is required (remote hosts must use sslmode=require).
      DATABASE_URL: postgresql://eidolon:ci-only-not-a-secret@localhost:5432/eidolon_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # match Render's pinned Python minor version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Up, all the way down, and up again: proves the downgrade works and the upgrade can be repeated.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      # Migration drift (models vs the migrated database), the create/hit/read/retention smoke test,
      # and the concurrency test (16 threads incrementing one trap's counter must add up exactly).
      - run: python -m pytest test_postgres.py -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint exits 0 on warnings (the 2 existing only-export-components ones), non-zero on errors.
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Dummy value: only checks that a production build succeeds; nothing is deployed.
          VITE_API_BASE: https://api.example.invalid
